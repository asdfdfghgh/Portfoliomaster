<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Exoplanet abundance surrogate workflow</title>
  <desc id="desc">Temperature, pressure, and atmospheric parameters are combined into a time-series input, encoded with LSTM layers, passed through a decoder, and mapped to molecular abundance profiles. Reference simulations are shown separately for validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fa"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3874d8"/><stop offset="1" stop-color="#35a6bc"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#44839b"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#26435c" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#173449" font-family="Arial,sans-serif" font-size="30" font-weight="700">Abundance-profile surrogate workflow</text>
  <text x="64" y="108" fill="#587184" font-family="Arial,sans-serif" font-size="17">Simplified from the supplied thesis architecture figure</text>

  <g filter="url(#shadow)" font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="65" y="148" width="300" height="82" rx="16" fill="#fff" stroke="#53a1ad" stroke-width="2"/>
    <text x="215" y="181" fill="#1e4858" font-size="20" font-weight="700">Temperature profile</text><text x="215" y="207" fill="#64818d" font-size="15">Scaled atmospheric structure</text>
    <rect x="450" y="148" width="300" height="82" rx="16" fill="#fff" stroke="#53a1ad" stroke-width="2"/>
    <text x="600" y="181" fill="#1e4858" font-size="20" font-weight="700">Pressure grid</text><text x="600" y="207" fill="#64818d" font-size="15">Log-pressure coordinates</text>
    <rect x="835" y="148" width="300" height="82" rx="16" fill="#fff" stroke="#53a1ad" stroke-width="2"/>
    <text x="985" y="181" fill="#1e4858" font-size="20" font-weight="700">Atmospheric parameters</text><text x="985" y="207" fill="#64818d" font-size="15">Metallicity · C/O · Tint · Kzz</text>

    <rect x="260" y="286" width="680" height="76" rx="15" fill="#fff" stroke="#39899b" stroke-width="2.5"/>
    <text x="600" y="333" fill="#173f55" font-size="22" font-weight="700">Input concatenation &amp; scaling</text>
    <rect x="332" y="414" width="536" height="70" rx="14" fill="#fff" stroke="#39899b" stroke-width="2"/>
    <text x="600" y="457" fill="#173f55" font-size="21" font-weight="700">Time-series sequence · [182, 6]</text>
    <rect x="382" y="537" width="436" height="70" rx="14" fill="#fff" stroke="#4386c4" stroke-width="2.5"/>
    <text x="600" y="580" fill="#245889" font-size="21" font-weight="700">LSTM layers → latent vector</text>
    <rect x="382" y="662" width="436" height="70" rx="14" fill="#fff" stroke="#4386c4" stroke-width="2.5"/>
    <text x="600" y="705" fill="#245889" font-size="21" font-weight="700">Decoder → species abundance profiles</text>
  </g>

  <g fill="none" stroke="#44839b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M215 230v23q0 20 22 20h363v12"/><path d="M600 230v42"/><path d="M985 230v23q0 20-22 20H600v12"/>
    <path d="M600 362v47"/><path d="M600 484v47"/><path d="M600 607v47"/>
  </g>

  <rect x="68" y="608" width="245" height="124" rx="16" fill="#eef6fb" stroke="#8db6c7" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="190" y="647" text-anchor="middle" fill="#315669" font-family="Arial,sans-serif" font-size="18" font-weight="700">Reference simulations</text>
  <text x="190" y="675" text-anchor="middle" fill="#587184" font-family="Arial,sans-serif" font-size="15">FastChem · VULCAN</text>
  <text x="190" y="701" text-anchor="middle" fill="#718b99" font-family="Arial,sans-serif" font-size="13">Used for validation</text>
  <path d="M313 670h53q22 0 22-22v-50" fill="none" stroke="#8caeba" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="64" y="782" fill="#718b99" font-family="Arial,sans-serif" font-size="14">Species shown in the supplied model figure: H₂O · CH₄ · CO · CO₂</text>
</svg>
